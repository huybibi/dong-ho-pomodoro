name: Build macOS installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  macos:
    name: macOS universal DMG
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build DMG (Apple Silicon + Intel)
        run: npx electron-builder --mac --universal --publish never

      - name: Verify DMG
        run: |
          ls -lh dist
          hdiutil verify dist/*.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pomodoro-macOS
          path: dist/*.dmg
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Pomodoro ${{ github.ref_name }} (macOS)
          body: |
            ## Cài trên macOS

            1. Tải file `.dmg`, mở ra rồi kéo **Pomodoro** vào thư mục **Applications**.
            2. Bản dựng này chưa có chữ ký Apple Developer (ad-hoc signing), nên lần đầu macOS sẽ chặn.
               Mở **System Settings → Privacy & Security**, kéo xuống và bấm **Open Anyway**.
            3. Nếu vẫn báo “app is damaged”, chạy lệnh sau trong Terminal rồi mở lại:

               ```sh
               xattr -dr com.apple.quarantine /Applications/Pomodoro.app
               ```

            DMG là bản **universal** — chạy được trên cả Mac Apple Silicon và Intel.
          files: dist/*.dmg
          fail_on_unmatched_files: true
