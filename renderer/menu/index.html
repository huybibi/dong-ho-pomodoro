<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'" />
    <link rel="stylesheet" href="../shared/base.css" />
    <link rel="stylesheet" href="menu.css" />
  </head>
  <body>
    <div id="card" class="card">
      <div id="head">
        <svg id="mini" viewBox="0 0 100 100">
          <defs>
            <radialGradient id="skin" cx="33%" cy="22%" r="88%">
              <stop offset="0%" stop-color="#ffb188" />
              <stop offset="18%" stop-color="#fc6836" />
              <stop offset="50%" stop-color="#e5341a" />
              <stop offset="82%" stop-color="#ba1c11" />
              <stop offset="100%" stop-color="#8c100b" />
            </radialGradient>
            <linearGradient id="leafg" x1="0.2" y1="0" x2="0.8" y2="1">
              <stop offset="0%" stop-color="#a9e690" />
              <stop offset="40%" stop-color="#5ab862" />
              <stop offset="100%" stop-color="#1c5d2e" />
            </linearGradient>
            <linearGradient id="stemg" x1="0" y1="0" x2="1" y2="0.4">
              <stop offset="0%" stop-color="#93dd85" />
              <stop offset="55%" stop-color="#4fa959" />
              <stop offset="100%" stop-color="#24682f" />
            </linearGradient>
            <filter id="blur6" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" /></filter>
            <filter id="blur3" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="1.9" /></filter>
            <filter id="blur2" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="1.1" /></filter>

            <path id="sepalA" d="M50 28.5 C 57.6 24 67.8 22.2 76.6 25.1 C 71.4 30.3 60.4 34.7 50 34.5 Z" />
            <path id="sepalB" d="M50 28.7 C 57 24.7 65.8 23.3 73.2 25.9 C 68.4 30.5 59.2 34.3 50 34.4 Z" />
            <path id="sepalC" d="M50 29.1 C 56.2 26.1 63.2 25.1 68.8 27.5 C 64.8 31.5 57.4 33.9 50 34.1 Z" />
            <g id="calyx">
              <use href="#sepalA" transform="rotate(-5 50 30.5)" />
              <use href="#sepalC" transform="rotate(56 50 30.5)" />
              <use href="#sepalB" transform="rotate(124 50 30.5)" />
              <use href="#sepalA" transform="rotate(181 50 30.5)" />
              <use href="#sepalB" transform="rotate(236 50 30.5)" />
              <use href="#sepalC" transform="rotate(304 50 30.5)" />
            </g>
          </defs>

          <g id="fruit">
            <g id="body">
              <path
                d="M50 30 C 61 27.2 71.6 30 78.8 37 C 86.2 44.2 89.4 54.4 88 63.4 C 86.4 74 78 82.6 67.6 85.8 C 62 87.6 56 88.2 50 87.8 C 44 88.2 38 87.6 32.4 85.8 C 22 82.6 13.6 74 12 63.4 C 10.6 54.4 13.8 44.2 21.2 37 C 28.4 30 39 27.2 50 30 Z"
                fill="url(#skin)" />

              <g fill="none" stroke="#8f1a10" stroke-width="2.8" stroke-linecap="round" opacity="0.13" filter="url(#blur3)">
                <path d="M50 34 C 46.6 47 42.8 62 41.8 78" />
                <path d="M50 34 C 54.4 47 59.2 62 60.4 78" />
                <path d="M50 34.5 C 40 44 31 55.5 25.6 69" />
                <path d="M50 34.5 C 60 44 69 55.5 74.4 69" />
              </g>

              <ellipse cx="50" cy="33.4" rx="13" ry="5.2" fill="#7e120d" opacity="0.38" filter="url(#blur6)" />
              <ellipse cx="50" cy="84" rx="21" ry="6.4" fill="#7c0f0b" opacity="0.2" filter="url(#blur6)" />
              <path d="M80.5 60 C 78.5 73 70 82 56.5 86" fill="none" stroke="#ffb890" stroke-width="4" stroke-linecap="round" opacity="0.18" filter="url(#blur6)" />
            </g>

            <ellipse cx="36" cy="45.5" rx="13" ry="9" fill="#fff" opacity="0.2" filter="url(#blur6)" />
            <ellipse cx="32.5" cy="42.5" rx="4.6" ry="3.1" fill="#fff" opacity="0.82" filter="url(#blur2)" />
            <ellipse cx="41.5" cy="40" rx="2.3" ry="1.5" fill="#fff" opacity="0.45" filter="url(#blur2)" />

            <ellipse cx="50" cy="31.4" rx="6" ry="3.2" fill="#2b7235" opacity="0.9" />
            <g transform="translate(0.5 1.9)" opacity="0.38"><use href="#calyx" fill="#1a4824" /></g>
            <use href="#calyx" fill="url(#leafg)" />

            <path d="M47.5 32.8 C 47.7 26.4 48.4 20.6 50 16 C 50.6 14.5 52.7 14.8 52.8 16.4 C 53.2 21.2 52.9 27.2 52.6 32.8 Z" fill="url(#stemg)" />
            <ellipse cx="50.2" cy="16.2" rx="2.7" ry="1.2" fill="#a8e69a" opacity="0.85" />
            <path d="M50.8 32.6 C 51 26.4 51.4 20.8 52.4 16.3" fill="none" stroke="#1f5c2b" stroke-width="1.1" stroke-linecap="round" opacity="0.45" />
          </g>
        </svg>
        <div id="who">
          <div id="title">Đồng hồ Pomodoro</div>
          <div id="sub">sẵn sàng cho một phiên sâu</div>
        </div>
        <button class="btn ghost" id="close" title="Đóng (Esc)">✕</button>
      </div>

      <!-- TRANG CHÍNH -->
      <div class="view on" id="v-main">
        <div class="today">
          <div class="t-row">
            <span id="today-count">0/8 phiên hôm nay</span>
            <span id="streak" class="streak">0 ngày</span>
          </div>
          <div class="bar"><div id="today-fill"></div></div>
          <div class="t-sub" id="today-sub"></div>
        </div>

        <input type="text" id="intent" placeholder="Phiên này tôi tập trung vào…" maxlength="90" />

        <div class="chips" id="presets"></div>

        <button class="btn primary big" id="start">Bắt đầu tập trung 25′</button>

        <div class="row2">
          <button class="btn" id="to-breathe">🫁 Hít thở tập trung</button>
          <button class="btn" id="short-break">☕ Nghỉ 5′</button>
        </div>

        <div class="toggles">
          <button class="tg" data-tg="ambient"><b>Âm thanh nền</b><span id="amb-label">đang tắt</span></button>
          <button class="tg" data-tg="guide"><b>Tiếng dẫn nhịp thở</b><span>âm cao lên khi hít vào</span></button>
        </div>

        <div class="foot">
          <button class="btn ghost" id="open-settings">Thống kê &amp; cài đặt</button>
          <button class="btn ghost" id="hide-orb">Ẩn cà chua</button>
        </div>
      </div>

      <!-- HÍT THỞ -->
      <div class="view" id="v-breathe">
        <div class="vhead">
          <button class="btn ghost" data-back>‹ Quay lại</button>
          <span class="vtitle">Chọn bài hít thở</span>
        </div>
        <div id="patterns"></div>
        <div class="note">Thở xong mới làm việc — não cần 60–90 giây để chuyển sang trạng thái tập trung.</div>
      </div>

      <!-- ÂM THANH -->
      <div class="view" id="v-ambient">
        <div class="vhead">
          <button class="btn ghost" data-back>‹ Quay lại</button>
          <span class="vtitle">Âm thanh nền</span>
        </div>
        <div class="chips wrap" id="ambients"></div>
        <label class="slider">
          <span>Âm lượng nền</span>
          <input type="range" id="amb-vol" min="0" max="1" step="0.02" />
        </label>
        <label class="slider" id="beat-wrap">
          <span>Nhịp binaural: <b id="beat-val">10 Hz</b></span>
          <input type="range" id="beat" min="2" max="20" step="0.5" />
        </label>
        <div class="note">Tiếng nâu che lấp tiếng ồn văn phòng. Binaural 10 Hz ở dải alpha giúp giữ tập trung — nên dùng tai nghe.</div>
      </div>
    </div>
    <script src="../shared/util.js"></script>
    <script src="menu.js"></script>
  </body>
</html>
