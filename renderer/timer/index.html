<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'" />
    <link rel="stylesheet" href="../shared/base.css" />
    <link rel="stylesheet" href="timer.css" />
  </head>
  <body>
    <div id="card" class="card">
      <div id="clock" class="mono">25:00</div>
      <div id="intent"></div>

      <div id="controls">
        <button id="add5" title="Thêm 5 phút">+5</button>
        <button id="pause" title="Tạm dừng (Ctrl+Alt+P)" aria-label="Tạm dừng">
          <svg class="ico-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.2" y="4.6" width="4.2" height="14.8" rx="1.3" /><rect x="13.6" y="4.6" width="4.2" height="14.8" rx="1.3" /></svg>
          <svg class="ico-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.4 4.9v14.2L20 12z" /></svg>
        </button>
      </div>

      <button id="stop" title="Kết thúc phiên (Ctrl+Alt+X)">✕</button>
      <div id="toast"></div>

      <div id="abort">
        <div class="abort-title">Vì sao dừng sớm?</div>
        <div class="abort-sub">Ghi lại một lần, vài hôm nữa sẽ thấy bạn hay bị cắt ngang vì gì.</div>
        <div id="reasons"></div>
        <div class="abort-foot">
          <button class="btn ghost" id="abort-cancel">Quay lại làm tiếp</button>
        </div>
      </div>
    </div>
    <script src="../shared/util.js"></script>
    <script src="timer.js"></script>
  </body>
</html>
